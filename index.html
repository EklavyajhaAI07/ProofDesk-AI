<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Primary Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/logo.svg" />

    <!-- Viewport & Mobile -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0F172A" />
    <meta name="color-scheme" content="light dark" />

    <!-- Primary SEO Meta Tags -->
    <title>ProofDesk AI — Turn Documents into Actionable Tasks Instantly</title>
    <meta name="description" content="ProofDesk AI converts unstructured PDFs, images, and text messages into actionable task lists with deadlines and AI-generated draft replies. Built for freelancers, consultants, and professionals." />
    <meta name="keywords" content="document processing, AI task extraction, PDF to tasks, image to tasks, AI draft reply, freelancer tools, project management, ProofDesk, document automation, action items" />
    <meta name="author" content="ProofDesk AI" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://proofdesk.ai/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://proofdesk.ai/" />
    <meta property="og:title" content="ProofDesk AI — Turn Documents into Actionable Tasks Instantly" />
    <meta property="og:description" content="AI-powered document processing that extracts action items, assigns deadlines and priorities, and generates professional draft replies from PDFs, images, and text." />
    <meta property="og:image" content="/logo.svg" />
    <meta property="og:site_name" content="ProofDesk AI" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://proofdesk.ai/" />
    <meta name="twitter:title" content="ProofDesk AI — Turn Documents into Actionable Tasks Instantly" />
    <meta name="twitter:description" content="AI-powered document processing that extracts action items, assigns deadlines and priorities, and generates professional draft replies." />
    <meta name="twitter:image" content="/logo.svg" />

    <!-- Structured Data / JSON-LD -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "ProofDesk AI",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "description": "AI-powered document processing tool that converts unstructured PDFs, images, and text messages into actionable task lists with deadlines and draft replies.",
      "url": "https://proofdesk.ai/",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "featureList": [
        "PDF document processing",
        "Image text extraction",
        "AI task extraction with priorities",
        "Deadline detection",
        "AI-generated draft replies",
        "Document history tracking"
      ],
      "screenshot": "/logo.svg"
    }
    </script>

    <!-- Preconnect to external origins for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- PDF.js for text extraction -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  </head>
  <body>
    <noscript>
      <div style="padding:2rem;text-align:center;font-family:system-ui,sans-serif;">
        <h1>ProofDesk AI</h1>
        <p>You need to enable JavaScript to run this application.</p>
        <p>ProofDesk AI converts unstructured documents into actionable task lists with deadlines and AI-generated draft replies. Built for freelancers, consultants, and professionals.</p>
      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
