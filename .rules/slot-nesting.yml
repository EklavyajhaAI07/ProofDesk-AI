---
id: radix-trigger-formcontrol-nesting
language: tsx
files:
  - src/**/*.tsx
message: |
  ❌ Detected dangerous Slot nesting: FormControl wrapped inside Radix UI Trigger (asChild)

  Problematic code:
  <PopoverTrigger asChild>
    <FormControl>      ← Will cause click events to fail
      <Button>...</Button>
    </FormControl>
  </PopoverTrigger>

  Correct usage:
  <PopoverTrigger asChild>
    <Button>...</Button>   ← Use Button directly
  </PopoverTrigger>

  Reason: Both FormControl and Trigger use Radix UI's Slot mechanism, double nesting will cause:
  - Ref transmission chain breakage
  - Click event loss
  - Internal component unable to interact

  FormControl should only be used for native form controls (Input, Textarea, Select), not for trigger buttons.
severity: error
rule:
  kind: jsx_element
  all:
    # Start tag conditions
    - has:
        kind: jsx_opening_element
        all:
          # Match all Radix UI Trigger components
          - has:
              field: name
              regex: "^(Popover|Dialog|DropdownMenu|AlertDialog|HoverCard|Menubar|NavigationMenu|ContextMenu|Tooltip)Trigger$"
          # Must have asChild attribute
          - has:
              kind: jsx_attribute
              has:
                kind: property_identifier
                regex: "^asChild$"
    # Direct child contains FormControl
    - has:
        kind: jsx_element
        has:
          kind: jsx_opening_element
          has:
            field: name
            regex: "^FormControl$"
